<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Statistiken</title>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Statistiken</h1>

    <div class="row">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header">
                    Ausgaben nach Kategorien
                </div>

                <div class="card-body">

                    <canvas id="categoryChart"></canvas>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header">
                    Kategorien Übersicht
                </div>

                <div class="card-body">

                    <table class="table table-striped">

                        <thead>
                            <tr>
                                <th>Kategorie</th>
                                <th>Betrag</th>
                            </tr>
                        </thead>

                        <tbody>

                        {% for i in range(labels|length) %}

                            <tr>

                                <td>
                                    {{ labels[i] }}
                                </td>

                                <td>
                                    {{ values[i] }} €
                                </td>

                            </tr>

                        {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const ctx = document.getElementById('categoryChart');

new Chart(ctx, {

    type: 'doughnut',

    data: {

        labels: {{ labels|tojson }},

        datasets: [{

            data: {{ values|tojson }},

            backgroundColor: [
                '#0d6efd',
                '#198754',
                '#dc3545',
                '#ffc107',
                '#6f42c1',
                '#20c997',
                '#fd7e14',
                '#6610f2'
            ]

        }]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {
                position: 'bottom'
            }

        }

    }

});

</script>

</body>

</html>
