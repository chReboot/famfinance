<!doctype html>
<html>

<head>
    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Buchungen</title>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Buchungen</h1>

    <form>
        <input
            class="form-control"
            name="q"
            value="{{ search }}"
            placeholder="Suche...">
    </form>

    <br>

    <table class="table table-striped table-hover">

        <thead>

            <tr>
                <th>Datum</th>
                <th>Empfänger</th>
                <th>Betrag</th>
                <th>Kategorie</th>
            </tr>

        </thead>

        <tbody>

        {% for tx in transactions %}

            <tr>

                <td>{{ tx[1] }}</td>

                <td>{{ tx[2] }}</td>

                <td>

                    {% if tx[3] > 0 %}

                        <span class="text-success fw-bold">
                            {{ "%.2f"|format(tx[3]) }} €
                        </span>

                    {% else %}

                        <span class="text-danger fw-bold">
                            {{ "%.2f"|format(tx[3]) }} €
                        </span>

                    {% endif %}

                </td>

                <td>

                    <form
                        method="post"
                        action="/transaction/update_category">

                        <input
                            type="hidden"
                            name="hash"
                            value="{{ tx[0] }}">

                        <select
                            name="category"
                            class="form-select form-select-sm"
                            onchange="this.form.submit()">

                            {% for category in categories %}

                                <option
                                    value="{{ category }}"
                                    {% if tx[4] == category %}selected{% endif %}>

                                    {{ category }}

                                </option>

                            {% endfor %}

                        </select>

                    </form>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
