<!doctype html>
<html>

<head>
    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Buchungen</title>
</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Buchungen</h1>

    <form>
        <input
            class="form-control"
            name="q"
            value="{{ search }}"
            placeholder="Suche...">
    </form>

    <br>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Datum</th>
                <th>Empfänger</th>
                <th>Betrag</th>
                <th>Kategorie</th>
            </tr>
        </thead>

        <tbody>

        {% for tx in transactions %}

            <tr>

                <td>{{ tx[0] }}</td>

                <td>{{ tx[1] }}</td>

                <td>

                    {% if tx[2] > 0 %}

                        <span class="text-success fw-bold">
                            {{ "%.2f"|format(tx[2]) }} €
                        </span>

                    {% else %}

                        <span class="text-danger fw-bold">
                            {{ "%.2f"|format(tx[2]) }} €
                        </span>

                    {% endif %}

                </td>

                <td>{{ tx[3] }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
