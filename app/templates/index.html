<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>FamFinance</title>

</head>

<body>
{% include 'navbar.html' %}
<div class="container mt-4">

    <h1>Finanz Dashboard</h1>

    <div class="row">

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">

                    <h6>Buchungen</h6>

                    <h3>
                        {{ bookings }}
                    </h3>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">

                    <h6>Saldo</h6>

                    <h3>
                        {{ "%.2f"|format(balance) }} €
                    </h3>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card border-success">
                <div class="card-body">

                    <h6>Einnahmen</h6>

                    <h3>
                        {{ "%.2f"|format(income) }} €
                    </h3>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card border-danger">
                <div class="card-body">

                    <h6>Ausgaben</h6>

                    <h3>
                        {{ "%.2f"|format(expenses) }} €
                    </h3>

                </div>
            </div>
        </div>

    </div>

    <hr>

    <form method="post" enctype="multipart/form-data">

        <input
            class="form-control"
            type="file"
            name="file">

        <br>

        <button
            class="btn btn-primary">
            CSV importieren
        </button>

    </form>

</div>

</body>

</html>
