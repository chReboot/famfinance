<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Kategorien</title>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Kategorien</h1>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Kategorie</th>
                <th>Buchungen</th>
                <th>Summe</th>
            </tr>
        </thead>

        <tbody>

        {% for cat in categories %}

            <tr>

                <td>{{ cat[0] }}</td>

                <td>{{ cat[1] }}</td>

                <td>

                    {% if cat[2] > 0 %}

                        <span class="text-success fw-bold">
                            {{ cat[2] }} €
                        </span>

                    {% else %}

                        <span class="text-danger fw-bold">
                            {{ cat[2] }} €
                        </span>

                    {% endif %}

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
