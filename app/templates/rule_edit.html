<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Regel bearbeiten</title>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Regel bearbeiten</h1>

    <form
        method="post"
        action="/rules/update">

        <input
            type="hidden"
            name="old_category"
            value="{{ category }}">

        <input
            type="hidden"
            name="old_keyword"
            value="{{ keyword }}">

        <div class="mb-3">

            <label class="form-label">
                Kategorie
            </label>

            <input
                class="form-control"
                name="category"
                value="{{ category }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Suchwort
            </label>

            <input
                class="form-control"
                name="keyword"
                value="{{ keyword }}">

        </div>

        <button
            class="btn btn-success">

            Speichern

        </button>

    </form>

</div>

</body>

</html>
