<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Regeln</title>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4">

    <h1>Kategorieregeln</h1>

    <p class="text-muted">
        Aktuelle Zuordnungen aus rules.json
    </p>

    {% for category, keywords in rules.items() %}

    <div class="card mb-3">

        <div class="card-header">

            <strong>{{ category }}</strong>

        </div>

        <div class="card-body">

            {% for keyword in keywords %}

                <span class="badge bg-primary me-1 mb-1">

                    {{ keyword }}

                    <a
                        href="/rules/edit?category={{ category }}&keyword={{ keyword }}"
                        class="text-white text-decoration-none ms-1"
                        title="Bearbeiten">

                        ✏️

                    </a>

                    <a
                        href="/rules/delete?category={{ category }}&keyword={{ keyword }}"
                        class="text-white text-decoration-none ms-1"
                        title="Löschen"
                        onclick="return confirm('Regel löschen?')">

                        ❌

                    </a>

                </span>

            {% endfor %}

        </div>

    </div>

    {% endfor %}

    <div class="card mt-4">

        <div class="card-header">
            Neue Regel hinzufügen
        </div>

        <div class="card-body">

            <form method="post" action="/rules/add">

                <div class="mb-3">

                    <label class="form-label">
                        Kategorie
                    </label>

                    <input
                        class="form-control"
                        name="category"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Suchbegriff
                    </label>

                    <input
                        class="form-control"
                        name="keyword"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    Regel hinzufügen

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
